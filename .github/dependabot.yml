version: 2

# docs/git-workflow.md §9 — a template repository is cloned long after it was
# written. Without a robot, the versions pinned here fossilise and the first
# clone starts on a stale stack.
#
# Three manifests cover four ecosystems: `uv.lock` is unique and lives at the
# root, the workspace covering `backend/` (see pyproject.toml,
# [tool.uv.workspace]); the frontend has its own pnpm lockfile; compose.yaml
# sits at the root. The actions need no manifest, they are scanned from the
# root too.

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # §3 — the list of scopes is closed, and `include: "scope"` would produce
    # `chore(deps-dev)` for every development dependency: pr-title.yml would
    # then reject most of the robot's pull requests. The scope is therefore
    # hardcoded, and Dependabot completes it in lowercase with no trailing
    # period, which is what `subjectPattern` accepts.
    commit-message:
      prefix: chore(deps)
    groups:
      # The noise is in the patches, the review load in the majors: the
      # former fit into one pull request per ecosystem, the latter open on
      # their own, one per dependency.
      uv:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        update-types: [minor, patch]

  # `docker-compose` is an ecosystem of its own, distinct from `docker`, which
  # only covers Dockerfiles. Without this entry the image pinned in
  # compose.yaml would fossilise — exactly what §9 refuses for every other
  # pinned version.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      docker-compose:
        update-types: [minor, patch]
