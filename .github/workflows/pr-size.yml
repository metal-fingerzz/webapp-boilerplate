name: Pull request size

# docs/git-workflow.md §5 — size is never blocking, only an indicative label.
# A large pull request can be legitimate (migration, refactor); the author
# justifies it in the description.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by size
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Indicative threshold from §5: ~400 lines of net diff.
          IGNORED: |
            /uv.lock
            /**/pnpm-lock.yaml
            /**/package-lock.json
        with:
          sizes: >-
            {
              "0":   "XS",
              "20":  "S",
              "100": "M",
              "400": "L",
              "800": "XL"
            }
