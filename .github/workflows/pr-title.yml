name: Pull request title

# Squash merge turns the pull request title into the commit message on `main`.
# That title is therefore the only place where the convention has to be enforced.
# See docs/git-workflow.md, §3 and §4.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  # `cancel-in-progress` is left at its GitHub default of `false` on purpose,
  # spelled out rather than omitted so it does not get flipped back by reflex.
  # Cancelling only pays off on a long workflow where just the latest commit
  # matters; this one takes a few seconds, so it saves nothing and costs a
  # verdict. Two events landing in the same second — Dependabot's force-push and
  # the title edit that follows it — cancel each other out, leaving the head SHA
  # with no surviving run and this blocking check stuck on a stale verdict.
  # Queueing keeps every event, and the last one to arrive still runs last.
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # docs/git-workflow.md §3 — types
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
          # docs/git-workflow.md §3 — scopes (closed list)
          scopes: |
            api
            web
            db
            ci
            deps
            repo
          requireScope: true
          # Lowercase description, no trailing period — except for Dependabot,
          # which capitalises the description it composes ("chore(deps): Bump
          # alembic from ...") and offers no option to stop it. The scope stays
          # enforced for everyone; only the capital is conceded, and only to the
          # bot. Matching on the pull request author rather than on
          # `github.actor`, which becomes a human as soon as anyone edits the
          # pull request. See docs/git-workflow.md §9.
          subjectPattern: >-
            ${{ github.event.pull_request.user.login == 'dependabot[bot]'
            && '^(?!.*\.$).+$' || '^(?![A-Z])(?!.*\.$).+$' }}
          # Conditioned on the same author as the pattern above, so each
          # author is told exactly the rules that apply to them.
          subjectPatternError: >-
            ${{ github.event.pull_request.user.login == 'dependabot[bot]'
            && 'The description "{subject}" is invalid: it must not end with a
            period.'
            || 'The description "{subject}" is invalid: it must start with a
            lowercase letter and must not end with a period.' }}
