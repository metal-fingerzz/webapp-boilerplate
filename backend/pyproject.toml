[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas Backers", email = "thomas.backers@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi[standard]>=0.141.1,<0.142.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
add-bounds = "major"
