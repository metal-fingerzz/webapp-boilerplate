[project]
name = "api"
# docs/git-workflow.md §8. The released version lives in the git tag, never in a
# manifest. `uv_build` refuses to build without this field, so it stays pinned to
# 0.0.0: nothing reads it, and nothing keeps it up to date.
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas Backers", email = "thomas.backers@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi[standard]>=0.141.1,<0.142.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.6,<0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
add-bounds = "major"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# Beyond the default rules (pycodestyle errors, Pyflakes): import sorting,
# outdated syntax and the bugbear set. Formatting is left entirely to
# `ruff format`, whose defaults already match the code in place.
select = ["E", "F", "I", "UP", "B"]
