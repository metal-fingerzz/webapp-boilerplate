[tool.uv]
add-bounds = "major"

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "poethepoet>=0.48.0",
  "python-semantic-release>=10.6.2,<11.0.0",
]

# --- Development ---

[tool.poe.env]
ENV = "development"

[tool.poe.tasks.backend-dev]
cwd = "backend"
cmd = "fastapi dev src/api/main.py"
help = "Run the API with autoreload"

[tool.poe.tasks.frontend-dev]
cwd = "frontend"
shell = "pnpm run dev"
help = "Run the web app with hot module replacement"

# --- Lint ---

[tool.poe.tasks.backend-lint]
sequence = [
  { cmd = "ruff check .", cwd = "backend" },
  { cmd = "ruff format --check .", cwd = "backend" },
]
ignore_fail = false
help = "Check the Python code and its formatting, without fixing anything"

[tool.poe.tasks.frontend-lint]
sequence = [
  { shell = "pnpm run lint", cwd = "frontend" },
  { shell = "pnpm run format:check", cwd = "frontend" },
]
ignore_fail = false
help = "Check the TypeScript code and its formatting, without fixing anything"

[tool.poe.tasks.lint]
sequence = ["backend-lint", "frontend-lint"]
ignore_fail = false
help = "Check both stacks, as the CI does"

# --- Tests ---

[tool.poe.tasks.backend-test]
cwd = "backend"
cmd = "pytest --cov=api --cov-report=term-missing"
help = "Run the Python test suite with a coverage report"

[tool.poe.tasks.frontend-test]
cwd = "frontend"
shell = "pnpm run test --coverage"
help = "Run the React test suite with a coverage report"

[tool.poe.tasks.test]
sequence = ["backend-test", "frontend-test"]
ignore_fail = false
help = "Run both test suites, as the CI does"

# --- Schema ---

[tool.poe.tasks.backend-schema]
cwd = "backend"
cmd = "python -m scripts.dump_openapi_schema"
help = "Dump the OpenAPI schema the frontend types are generated from"

[tool.poe.tasks.frontend-schema]
cwd = "frontend"
shell = "pnpm run generate:schema"
help = "Generate the TypeScript types from the dumped OpenAPI schema"

[tool.poe.tasks.schema]
sequence = ["backend-schema", "frontend-schema"]
ignore_fail = false
help = "Dump the OpenAPI schema, then generate the types from it"

# --- Build ---

[tool.poe.tasks.frontend-build]
cwd = "frontend"
shell = "pnpm run build"
help = "Type-check the web app and build its production bundle"

[tool.poe.tasks.build]
sequence = ["schema", "frontend-build"]
ignore_fail = false
help = "Regenerate the types, then build the production bundle"

# --- Release ---

[tool.poe.tasks.release]
cmd = "semantic-release version --no-commit --no-changelog --tag --push --vcs-release"
help = "Tag the next version, push it and publish the GitHub release"

[tool.poe.tasks.release-check]
cmd = "semantic-release --noop version --no-commit --no-changelog --tag --push --vcs-release"
help = "Rehearse the release without tagging or publishing anything"

# --- Database ---

# docs/database.md. `docker compose` goes through poe like every other entry
# point of the monorepo, so that what a contributor types is the same on both
# stacks — and so that `--wait` is never left out by hand.

[tool.poe.tasks.db-up]
cmd = "docker compose up --detach --wait"
help = "Start the development database and wait until it accepts connections"

[tool.poe.tasks.db-down]
cmd = "docker compose down"
help = "Stop the development database, keeping its data"

[tool.poe.tasks.db-reset]
sequence = [
  { cmd = "docker compose down --volumes" },
  { cmd = "docker compose up --detach --wait" },
]
ignore_fail = false
help = "Destroy the development database and start an empty one"

# --- Migrations ---

[tool.poe.tasks.revision]
cwd = "backend"
cmd = "alembic revision --autogenerate -m \"${message}\""
help = "Autogenerate a migration from the models, against the running database"

  [[tool.poe.tasks.revision.args]]
  name = "message"
  options = ["-m", "--message"]
  required = true
  help = "What the migration does, used in its file name"

[tool.poe.tasks.migrate]
cwd = "backend"
cmd = "alembic upgrade head"
help = "Apply every pending migration to the database"

[tool.poe.tasks.rollback]
cwd = "backend"
cmd = "alembic downgrade -1"
help = "Revert the last migration applied to the database"

# --- Maintenance ---

[tool.poe.tasks.fetch-password-blacklist]
cwd = "backend"
cmd = "python -m scripts.fetch_password_blacklist"
help = "Fetch the common-password blocklist from SecLists (network access)"

# --- Release configuration ---

# docs/git-workflow.md §8. The released version lives in the git tag and nowhere
# else: `poe release` never commits, so it needs nothing beyond the GITHUB_TOKEN
# that Actions mints for each run — no personal token, no branch protection
# bypass, nothing to provision in a repository created from this template.

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
# A repository created from this template starts without any tag. Without this,
# its first release would be 1.0.0 instead of 0.1.0.
allow_zero_version = true
# Leaving 0.x stays a deliberate act: it takes a `!` in the pull request title.
major_on_zero = true

[tool.semantic_release.branches.main]
match = "main"

# Mirrors the closed list of §3, the one pr-title.yml already enforces on every
# title. A type missing from this list parses as nothing and bumps nothing.
[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "chore", "docs", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix"]
other_allowed_tags = ["chore", "docs", "refactor", "test"]
