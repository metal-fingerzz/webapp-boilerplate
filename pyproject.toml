[tool.uv]
add-bounds = "major"

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "poethepoet>=0.48.0",
]

# --- Development ---

[tool.poe.env]
ENV = "development"

[tool.poe.tasks.backend-dev]
cwd = "backend"
cmd = "fastapi dev src/api/main.py"
help = ""

[tool.poe.tasks.frontend-dev]
cwd = "frontend"
shell = "pnpm run dev"
help = ""

# --- Lint ---

[tool.poe.tasks.backend-lint]
sequence = [
  { cmd = "ruff check .", cwd = "backend" },
  { cmd = "ruff format --check .", cwd = "backend" },
]
ignore_fail = false
help = ""

[tool.poe.tasks.frontend-lint]
sequence = [
  { shell = "pnpm run lint", cwd = "frontend" },
  { shell = "pnpm run format:check", cwd = "frontend" },
]
ignore_fail = false
help = ""

[tool.poe.tasks.lint]
sequence = ["backend-lint", "frontend-lint"]
ignore_fail = false
help = ""

# --- Tests ---

[tool.poe.tasks.backend-test]
cwd = "backend"
cmd = "pytest --cov=api --cov-report=term-missing"
help = ""

[tool.poe.tasks.frontend-test]
cwd = "frontend"
shell = "pnpm run test --coverage"
help = ""

[tool.poe.tasks.test]
sequence = ["backend-test", "frontend-test"]
ignore_fail = false
help = ""

# --- Schema ---

[tool.poe.tasks.backend-schema]
cwd = "backend"
cmd = "python -m scripts.dump_openapi_schema"
help = ""

[tool.poe.tasks.frontend-schema]
cwd = "frontend"
shell = "pnpm run generate:schema"
help = ""

[tool.poe.tasks.schema]
sequence = ["backend-schema", "frontend-schema"]
ignore_fail = false
help = ""

# --- Build ---

[tool.poe.tasks.frontend-build]
cwd = "frontend"
shell = "pnpm run build"
help = ""

[tool.poe.tasks.build]
sequence = ["schema", "frontend-build"]
ignore_fail = false
help = ""

# --- Migrations ---

[tool.poe.tasks.revision]
cwd = "backend"
cmd = "alembic revision --autogenerate -m ${message}"
help = ""

  [[tool.poe.tasks.revision.args]]
  name = "message"
  options = ["-m", "--message"]
  required = true
  help = ""

[tool.poe.tasks.migrate]
cwd = "backend"
cmd = "alembic upgrade head"
help = ""
