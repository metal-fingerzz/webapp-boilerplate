[tool.uv]
add-bounds = "major"

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "poethepoet>=0.48.0",
]

# --- Development ---

[tool.poe.env]
ENV = "development"

[tool.poe.tasks.backend-dev]
cwd = "backend"
cmd = "fastapi dev src/api/main.py"
help = ""

[tool.poe.tasks.frontend-dev]
cwd = "frontend"
shell = "pnpm run dev"
help = ""

# --- Tests ---

[tool.poe.tasks.backend-test]
cwd = "backend"
cmd = "pytest --cov=api --cov-report=term-missing"
help = ""

# --- Schema ---

[tool.poe.tasks.backend-schema]
cwd = "backend"
cmd = "python -m scripts.dump_openapi_schema"
help = ""

[tool.poe.tasks.frontend-schema]
cwd = "frontend"
shell = "pnpm run generate:schema"
help = ""

[tool.poe.tasks.schema]
sequence = ["backend-schema", "frontend-schema"]
ignore_fail = false
help = ""

# --- Migrations ---

[tool.poe.tasks.revision]
cwd = "backend"
cmd = "alembic revision --autogenerate -m ${message}"
help = ""

  [[tool.poe.tasks.revision.args]]
  name = "message"
  options = ["-m", "--message"]
  required = true
  help = ""

[tool.poe.tasks.migrate]
cwd = "backend"
cmd = "alembic upgrade head"
help = ""
