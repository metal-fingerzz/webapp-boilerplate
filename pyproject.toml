[tool.uv]
add-bounds = "major"

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "poethepoet>=0.48.0",
]

# --- Development ---

[tool.poe.env]
ENV = "development"

[tool.poe.tasks.backend-dev]
cwd = "backend"
cmd = "fastapi dev src/api/main.py"
help = ""

[tool.poe.tasks.frontend-dev]
cwd = "frontend"
shell = "pnpm run dev"
help = ""

# --- Schema ---

[tool.poe.tasks.backend-schema]
cwd = "backend"
cmd = "python -m scripts.dump_openapi_schema"
help = ""

[tool.poe.tasks.frontend-schema]
cwd = "frontend"
shell = "pnpm openapi-typescript ../backend/openapi.json -o src/api/schema.d.ts"
help = ""

[tool.poe.tasks.schema]
sequence = ["backend-schema", "frontend-schema"]
ignore_fail = false
help = ""

# --- Migrations ---

[tool.poe.tasks.migrate]
cwd = "backend"
cmd = "alembic upgrade head"
help = ""
