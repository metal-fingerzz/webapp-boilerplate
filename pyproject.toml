[tool.uv]
add-bounds = "major"

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "poethepoet>=0.48.0",
]

# --- Development ---

[tool.poe.env]
ENV = "development"

[tool.poe.tasks.backend-dev]
help = ""
cwd = "backend"
cmd = "uv run fastapi dev src/api/main.py"

[tool.poe.tasks.frontend-dev]
help = ""
cwd = "frontend"
shell = "pnpm run dev"

# --- Schema ---

[tool.poe.tasks.backend-schema]
help = ""
cwd = "backend"
cmd = "uv run python -m scripts.dump_openapi_schema"

[tool.poe.tasks.frontend-schema]
help = ""
cwd = "frontend"
shell = "pnpm openapi-typescript ../backend/openapi.json -o src/api/schema.d.ts"

[tool.poe.tasks.schema]
help = ""
sequence = ["backend-schema", "frontend-schema"]
ignore_fail = false

# --- Migrations ---

[tool.poe.tasks.migrate]
help = ""
cwd = "backend"
cmd = "uv run alembic upgrade head"
